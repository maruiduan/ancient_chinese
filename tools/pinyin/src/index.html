<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#dff1ff">
<title>拼音闯关 · 听音挖矿 · lucca</title>
<meta name="description" content="听读音，挖出对的拼音矿石。覆盖普通话全部常用带调音节，练到又对又快。">
<link rel="canonical" href="https://www.lucca.top/pinyin/">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preload" href="fonts/lucca-pinyin-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{CSS}}">
<script>
var _hmt = _hmt || [];
_hmt.push(["_setAutoPageview", false]);
_hmt.push(["_trackPageview", "/pinyin/"]);
(function () {
  var hm = document.createElement("script");
  hm.async = true;
  hm.src = "https://hm.baidu.com/hm.js?b5b9eb7e229dc60c4ebcd43c57100446";
  hm.onerror = function () {};
  var s = document.getElementsByTagName("script")[0];
  if (s && s.parentNode) s.parentNode.insertBefore(hm, s); else document.head.appendChild(hm);
})();
</script>
</head>
<body>
<div id="sky" aria-hidden="true"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>
<div id="app">

<section id="home" class="screen">
  <a class="back-site" href="https://www.lucca.top/">← lucca.top</a>
  <div class="home-hero">
    <canvas class="hero-pick" width="16" height="16" data-sprite="pickaxe"></canvas>
    <h1>拼音闯关</h1>
    <p class="sub">听音挖矿</p>
  </div>
  <div class="home-gems"><canvas width="16" height="16" data-sprite="diamond"></canvas><b id="homeGems">0</b></div>
  <button id="btnPlay" class="mc-btn big green">⛏ 开始挖矿</button>
  <p id="homeHint" class="hint"></p>
  <div class="home-row">
    <button id="btnMap" class="mc-btn">🗺 拼音地图</button>
    <button id="btnOralHome" class="mc-btn">🗣 爸爸抽查</button>
    <button id="btnParent" class="mc-btn">👨 家长</button>
  </div>
  <div class="home-ground" aria-hidden="true"></div>
</section>

<section id="play" class="screen" hidden>
  <div class="hud">
    <button id="btnQuit" class="icon-btn" aria-label="回首页">✕</button>
    <div id="progress" class="progress"></div>
    <div class="gems"><canvas width="16" height="16" data-sprite="diamond"></canvas><b id="gems">0</b></div>
  </div>
  <div id="modeTag" class="mode-tag"></div>
  <button id="btnSpeak" class="speaker" aria-label="再听一遍"><canvas width="16" height="16" data-sprite="noteblock"></canvas><span>再听</span></button>
  <div id="ores" class="ores"></div>
  <div id="fx" class="fx" aria-hidden="true"></div>
</section>

<section id="result" class="screen" hidden>
  <h2 id="resTitle">挖完啦！</h2>
  <div class="res-gems"><canvas width="16" height="16" data-sprite="diamond"></canvas><b id="resGems">+0</b></div>
  <div id="resUp" class="res-up"></div>
  <div class="res-btns">
    <button id="btnAgain" class="mc-btn big green">⛏ 再来一局</button>
    <button id="btnOral" class="mc-btn">🗣 爸爸抽查（可选）</button>
    <div class="home-row">
      <button id="btnResMap" class="mc-btn">🗺 地图</button>
      <button id="btnResHome" class="mc-btn">🏠 首页</button>
    </div>
  </div>
</section>

<section id="map" class="screen" hidden>
  <div class="bar"><button class="icon-btn" data-go="home" aria-label="返回">←</button><h2>拼音地图</h2></div>
  <div id="mapStats" class="map-stats"></div>
  <div class="legend"><span><i class="lv0"></i>石头</span><span><i class="lv1"></i>铁</span><span><i class="lv2"></i>金</span><span><i class="lv3"></i>钻石</span></div>
  <div id="mapGrid" class="map-grid"></div>
</section>

<section id="oral" class="screen" hidden>
  <div class="bar"><button class="icon-btn" data-go="home" aria-label="返回">←</button><h2>爸爸抽查</h2><span id="oralCount" class="bar-right"></span></div>
  <p class="hint">让孩子大声读出来，爸爸来判断。</p>
  <div id="oralCard" class="oral-card"></div>
  <button id="oralListen" class="mc-btn small">🔊 听标准读音</button>
  <div class="oral-btns">
    <button id="oralBad" class="mc-btn big red">✘ 没读对</button>
    <button id="oralOk" class="mc-btn big green">✔ 读对了</button>
  </div>
</section>

<section id="parent" class="screen" hidden>
  <div class="bar"><button class="icon-btn" data-go="home" aria-label="返回">←</button><h2>家长</h2></div>
  <div id="parentBody" class="parent-body"></div>
</section>

<div id="modal" class="modal" hidden><div class="modal-box"><button class="icon-btn modal-x" aria-label="关闭">✕</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast" hidden></div>
</div>
<script src="{{DATA}}"></script>
<script src="{{JS}}"></script>
</body>
</html>
