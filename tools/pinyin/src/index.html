<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9fdcff">
<title>拼音闯关 · 拼音认字 · 看字选拼音 · 冒险 · lucca</title>
<meta name="description" content="看拼音认字、看字选拼音、按读音找字，还有矿洞、守村、末地三章冒险。覆盖普通话全部常用带调音节，练到又对又快。">
<link rel="canonical" href="https://www.lucca.top/pinyin/index.html">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preload" href="fonts/lucca-pinyin-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{PIXEL}}" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"LuccaPixel";src:url("{{PIXEL}}") format("woff2");font-display:block}</style>
<link rel="stylesheet" href="{{CSS}}">
<script>
var _hmt = _hmt || [];
_hmt.push(["_setAutoPageview", false]);
_hmt.push(["_trackPageview", "/pinyin/index.html"]);
(function () {
  var hm = document.createElement("script");
  hm.async = true;
  hm.src = "https://hm.baidu.com/hm.js?b5b9eb7e229dc60c4ebcd43c57100446";
  hm.onerror = function () {};
  var s = document.getElementsByTagName("script")[0];
  if (s && s.parentNode) s.parentNode.insertBefore(hm, s); else document.head.appendChild(hm);
})();
</script>
</head>
<body>
<div id="world" aria-hidden="true">
  <i class="sun"></i>
  <i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="cloud c4"></i>
  <i class="hills"></i>
  <i class="ground"></i>
</div>
<div id="app">

<section id="home" class="screen">
  <a class="site-link" href="https://www.lucca.top/"><i class="ic" data-ic="back"></i>lucca.top</a>
  <div class="logo-wrap">
    <canvas class="logo-pick" width="16" height="16" data-sprite="pickaxe"></canvas>
    <h1 class="logo">拼音闯关</h1>
    <span class="splash">看拼音，认新字！</span>
  </div>
  <div class="menu">
    <button id="btnPlay" class="mc-btn wide primary"><i class="ic" data-ic="pick"></i><span class="lbl">开始挖矿</span></button>
    <div id="homeHint" class="menu-hint"></div>
    <div class="menu-row big-row"><button id="btnPick" class="mc-btn gold"><img id="pickIc" class="bal-ic" alt=""><span class="lbl">看字选拼音</span></button><button id="btnArcade" class="mc-btn sky"><img id="advIc" class="bal-ic" alt=""><span class="lbl">冒险闯关</span></button></div>
    <div class="menu-row">
      <button id="btnMap" class="mc-btn"><i class="ic" data-ic="map"></i>拼音地图</button>
      <button id="btnOralHome" class="mc-btn"><i class="ic" data-ic="talk"></i>爸爸抽查</button>
    </div>
    <button id="btnParent" class="mc-btn wide subtle"><i class="ic" data-ic="book"></i>家长</button>
  </div>
  <div class="home-stats" id="homeStats"></div>
  <div class="scenery" aria-hidden="true">
    <canvas class="tree t1" width="16" height="32" data-sprite="tree"></canvas>
    <canvas class="tree t2" width="16" height="32" data-sprite="tree"></canvas>
    <div class="ore-pile" id="orePile"></div>
    <div class="home-farm"><img data-a="cow" class="hf1" alt=""><img data-a="pig" class="hf2" alt=""><img data-a="chicken" class="hf3" alt=""><img data-a="sheep" class="hf4" alt=""></div>
    <div class="home-hero"><img id="homeKid" class="hk" alt=""><img id="homeZombie" class="hz2" alt=""></div>
  </div>
</section>

<section id="play" class="screen" hidden>
  <div class="hud">
    <button id="btnQuit" class="mc-btn icon" aria-label="回首页"><i class="ic" data-ic="house"></i></button>
    <div id="modeTag" class="mode-tag"></div>
    <button id="btnHelp" class="mc-btn icon" aria-label="怎么玩"><i class="ic" data-ic="help"></i></button>
  </div>
  <div id="stage" class="stage"></div>
  <div class="xp-wrap"><div class="xp"><i id="xpFill"></i></div></div>
  <div id="hotbar" class="hotbar"></div>
  <div id="fx" class="fx" aria-hidden="true"></div>
</section>

<section id="camp" class="screen" hidden>
  <div class="page-bar"><button id="btnCampHome" class="mc-btn icon" aria-label="返回"><i class="ic" data-ic="back"></i></button><h2 class="page-title">冒险地图</h2></div>
  <div class="camp-map"><div id="campNodes" class="camp-nodes"></div></div>
  <div class="camp-inv gui"><span class="inv-title">背包</span><div id="campInv" class="inv-slots"></div></div>
</section>

<section id="game" class="screen" hidden>
  <div class="hud">
    <button id="btnArcQuit" class="mc-btn icon" aria-label="回地图"><i class="ic" data-ic="map"></i></button>
    <div class="ch-tag"><span id="chName" class="ch-name"></span><div class="ch-prog"><i id="chProg"></i></div></div>
    <div id="hearts" class="hearts"></div>
    <button id="btnArcHelp" class="mc-btn icon" aria-label="怎么玩"><i class="ic" data-ic="help"></i></button>
  </div>
  <div id="scene" class="scene"></div>
  <div class="qpanel gui">
    <div class="qhead"><i id="qType" class="qtype"></i><div id="qPrompt" class="q-prompt"></div>
      <button id="qSpeak" class="speaker" type="button" aria-label="听一听"><span class="waves"><i></i><i></i><i></i></span><canvas width="16" height="16" data-sprite="noteblock"></canvas></button></div>
    <div class="qtimer"><i id="qTimer"></i></div>
    <div id="qOpts" class="qopts"></div>
  </div>
  <div class="bag-wrap"><div id="bag" class="hotbar bag"></div></div>
  <div id="fx3" class="fx" aria-hidden="true"></div>
</section>

<section id="result" class="screen" hidden>
  <div class="gui result-gui">
    <i id="resIcon" class="res-icon"></i>
    <h2 id="resTitle" class="gui-title">挖完啦！</h2>
    <div id="resUp" class="res-up"></div>
    <div class="res-btns">
      <button id="btnAgain" class="mc-btn wide primary"><i class="ic" data-ic="pick"></i><span class="lbl">再来一局</span></button>
      <button id="btnOral" class="mc-btn wide"><i class="ic" data-ic="talk"></i>读给爸爸听</button>
      <div class="menu-row">
        <button id="btnResMap" class="mc-btn"><i class="ic" data-ic="map"></i>地图</button>
        <button id="btnResHome" class="mc-btn"><i class="ic" data-ic="house"></i>首页</button>
      </div>
    </div>
  </div>
</section>

<section id="map" class="screen" hidden>
  <div class="page-bar"><button class="mc-btn icon" data-go="home" aria-label="返回"><i class="ic" data-ic="back"></i></button><h2 class="page-title">拼音地图</h2></div>
  <div id="mapStats" class="map-stats"></div>
  <div id="mapGrid" class="map-grid"></div>
</section>

<section id="oral" class="screen" hidden>
  <div class="page-bar"><button class="mc-btn icon" data-go="home" aria-label="返回"><i class="ic" data-ic="back"></i></button><h2 class="page-title">爸爸抽查</h2><span id="oralCount" class="page-count"></span></div>
  <p class="oral-hint">孩子大声读，爸爸来判断</p>
  <div class="sign"><div id="oralCard" class="sign-board"></div><i class="sign-post"></i></div>
  <div class="oral-btns">
    <button id="oralBad" class="mc-btn big red"><i class="ic" data-ic="cross"></i>没读对</button>
    <button id="oralListen" class="mc-btn"><i class="ic" data-ic="note"></i>听标准音</button>
    <button id="oralOk" class="mc-btn big green"><i class="ic" data-ic="check"></i>读对了</button>
  </div>
</section>

<section id="parent" class="screen" hidden>
  <div class="page-bar"><button class="mc-btn icon" data-go="home" aria-label="返回"><i class="ic" data-ic="back"></i></button><h2 class="page-title">家长</h2></div>
  <div id="parentBody" class="parent-body"></div>
</section>

<div id="modal" class="modal" hidden><div class="gui modal-box"><button class="mc-btn icon modal-x" aria-label="关闭"><i class="ic" data-ic="cross"></i></button><div id="modalBody"></div></div></div>
<div id="toast" class="toast" hidden></div>
</div>
<script src="{{DATA}}"></script>
<script src="{{CHARS}}"></script>
<script src="{{JS}}"></script>
</body>
</html>
