name: Publish pinyin game

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - www/pinyin/**
      - scripts/publish_pinyin.py
      - scripts/oss_headers.py
      - scripts/put_oss_object.py
      - .github/workflows/publish-pinyin.yml

permissions:
  contents: read

concurrency:
  group: pinyin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Upload www/pinyin to lucca-www/pinyin/
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: https://oss-cn-hongkong.aliyuncs.com
          OSS_REGION: cn-hongkong
        run: python3 scripts/publish_pinyin.py www/pinyin
