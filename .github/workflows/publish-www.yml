name: Publish lucca homepage

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - www/index.html
      - www/robots.txt
      - www/sitemap.xml
      - scripts/oss_headers.py
      - scripts/put_oss_object.py
      - scripts/publish_homepage.py
      - .github/workflows/publish-www.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Upload www pages to lucca-www
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: https://oss-cn-hongkong.aliyuncs.com
          OSS_REGION: cn-hongkong
        run: python3 scripts/publish_homepage.py www
