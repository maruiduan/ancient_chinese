name: Deploy audited artifact to OSS

on:
  workflow_call:
    inputs:
      artifact-id:
        required: true
        type: string
    secrets:
      OSS_ACCESS_KEY_ID:
        required: true
      OSS_ACCESS_KEY_SECRET:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: site
          merge-multiple: true
      - name: Install ossutil 2.4.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.4.0/ossutil-2.4.0-linux-amd64.zip
          echo "85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c  /tmp/ossutil.zip" | sha256sum -c
          unzip -q /tmp/ossutil.zip -d /tmp
          sudo mv /tmp/ossutil-2.4.0-linux-amd64/ossutil /usr/local/bin/ossutil
      - name: Publish assets before entry points
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: https://oss-cn-hongkong.aliyuncs.com
          OSS_REGION: cn-hongkong
        run: |
          set -euo pipefail
          test -n "$OSS_ACCESS_KEY_ID"
          test -n "$OSS_ACCESS_KEY_SECRET"
          python3 scripts/deploy_oss.py site oss://guwen-lucca
      - name: Verify public OSS bytes against the audited artifact
        run: python3 scripts/verify_live.py site https://guwen-lucca.oss-cn-hongkong.aliyuncs.com/
      - name: Publish lucca homepage
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: https://oss-cn-hongkong.aliyuncs.com
          OSS_REGION: cn-hongkong
        run: python3 scripts/publish_homepage.py www
