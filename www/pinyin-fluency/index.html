const pyToneMarks=['','\u0304','\u0301','\u030c','\u0300',''];
function pyWithTone(word,tone){
 const base=String(word).normalize('NFC');
 if(tone===0||tone===5)return base;
 let i=base.indexOf('a');if(i<0)i=base.indexOf('e');if(i<0)i=base.indexOf('ou');
 if(i<0)for(let j=base.length-1;j>=0;j--)if('aeiouüê'.includes(base[j])){i=j;break;}
 if(i<0||!pyToneMarks[tone])return null;
 return (base.slice(0,i+1)+pyToneMarks[tone]+base.slice(i+1)).normalize('NFC');
}
function pyDictation(s){
 const input=norm(s).replace(/u:/g,'ü');
 return input.split(/([\s'’\-]+)/).map(word=>{
  const hit=word.match(/^([a-züê]+)([0-5])$/);
  if(!hit)return word;
  const base=hit[1].replace(/^([jqxy])ü/,'$1u');
  return pyWithTone(base,Number(hit[2]))||word;
 }).join('').replace(/’/g,"'");
}
function pyWrittenParts(m){
 const original=m.parts?.length?m.parts:[m.text];
 if(m.track!=='py'||m.type!=='syllable')return original;
 let idx=0;const text=[...m.text.normalize('NFC')];
 if(original.reduce((n,s)=>n+[...s.normalize('NFC')].length,0)!==text.length)return [m.text];
 return original.map(s=>{const count=[...s.normalize('NFC')].length;const piece=text.slice(idx,idx+count).join('');idx+=count;return piece;});
}

 if(!num(x.stars)||x.stars<0||x.stars>1e7||!Number.isInteger(x.turn)||x.turn<0||![0,1,2,3].includes(x.finale))return false;

 for(const a of x.attempts)if(!obj(a)||!str(a.id)||!SKILL.has(a.skill)||!MATERIAL.has(a.material)||!num(a.time)||!['independent','hinted','modelled'].includes(a.result)||!arr(a.errors)||!Number.isInteger(a.turn)||!str(a.dimension))return false;

try{const raw=localStorage.getItem(STORE);if(raw){const parsed=JSON.parse(raw);if(validSave(parsed))S={...defaults(),...parsed,settings:{...defaults().settings,...parsed.settings}};}localStorage.setItem(STORE,JSON.stringify(S));}catch{storageAvailable=false;}
let UI={page:null,args:{},quest:null,task:null,feedback:null,delivery:false,lastFocus:null};
let world=null,toastTimer=null,session=uid(),lastReportCache=null;
function tr(k,...v){let text=(TEXT[k]||[k,k])[S.settings.lang==='en'?1:0];return v.reduce((t,x,i)=>t.replaceAll('{'+i+'}',x),text);}
function loc(obj){return typeof obj==='string'?obj:obj?.[S.settings.lang]||obj?.zh||'';}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4200);}
function save(){lastReportCache=null;try{localStorage.setItem(STORE,JSON.stringify(S));storageAvailable=true;}catch{storageAvailable=false;toast(tr('storageFail'));}}
function logEvent(type,data={}){S.events.push({id:uid(),type,time:Date.now(),session,turn:S.turn,...data});save();}
function markSeen(mid,help=false){if(!S.seen[mid])S.seen[mid]={first:Date.now(),last:Date.now(),count:0};S.seen[mid].last=Date.now();S.seen[mid].count++;if(help)S.seen[mid].help=true;save();}
function skillEvidence(id){
 if(!lastReportCache){const bySkill=new Map(),byError=new Map();for(const a of S.attempts){if(!bySkill.has(a.skill))bySkill.set(a.skill,[]);bySkill.get(a.skill).push(a);}for(const e of S.events)if(e.type==='wrong'){if(!byError.has(e.skill))byError.set(e.skill,[]);byError.get(e.skill).push(e);}lastReportCache={bySkill,byError};}
 const a=lastReportCache.bySkill.get(id)||[],errors=lastReportCache.byError.get(id)||[],ind=a.filter(a=>a.result==='independent'),ids=new Set(ind.map(a=>a.evidenceKey||a.material)),dims=new Set(ind.map(a=>a.dimension));
 const last=a.at(-1),spaced=ind.some(a=>a.spaced),failed=errors.length&&(!last||errors.at(-1).time>last.time);
 let status=a.length?'practicing':SKILL.get(id).materials.some(mid=>S.seen[mid])?'seen':'notSeen';

 const due=!!last&&(Date.now()>=dueAt||(S.turn-last.turn>=5&&(!spaced||last.result!=='independent'))) || !!failed;

function dueSkills(track){return DB.skills.filter(s=>(!track||s.track===track)&&skillEvidence(s.id).due).sort((a,b)=>{const ea=skillEvidence(a.id),eb=skillEvidence(b.id);return eb.errors-ea.errors||ea.dueAt-eb.dueAt;});}
function recommended(track){const due=dueSkills(track);if(due.length)return due[0].region;const start=S.placement[track]||1;return DB.regions.find(r=>r.track===track&&Number(r.id.replace(/\D/g,''))>=start&&!S.completed[r.id])?.id||DB.regions.find(r=>r.track===track&&!S.completed[r.id])?.id||(track==='py'?'py8':'en10');}
function routesComplete(){return DB.regions.filter(r=>['py','en'].includes(r.track)).every(r=>S.completed[r.id]);}
function award(key,n){if(S.earned[key])return false;S.earned[key]=true;S.stars+=n;save();return true;}
function finishRegion(id){if(!S.completed[id]){S.completed[id]=true;S.repairs[id]=3;award('region:'+id,8);save();}world?.refreshProgress();renderHUD();}
function download(name,content,mime='application/json'){const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function exportSave(prefix='dragonword-save'){download(prefix+'-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,2));}
async function importSave(file){try{if(file.size>30e6)throw Error();const raw=JSON.parse(await file.text());if(!validSave(raw))throw Error();exportSave('dragonword-before-import');AudioEngine.stop();S={...defaults(),...raw,settings:{...defaults().settings,...raw.settings}};UI.quest=null;UI.task=null;save();world?.enter(S.region);setLanguage(S.settings.lang);showPage('settings');toast(tr('saveImported'));}catch{toast(tr('saveBad'));}}
const AudioEngine={token:0,current:null,history:[],voices:[],available:true,
 stop(){this.token++;if(this.current){this.current.pause();this.current.src='';this.current=null;}globalThis.speechSynthesis?.cancel();},
 refresh(){this.voices=globalThis.speechSynthesis?.getVoices()||[];},
 voice(track){this.refresh();const lang=track==='py'?'zh-CN':S.settings.accent;const key=track==='py'?S.settings.voicePy:S.settings.voiceEn;const all=this.voices.filter(v=>track==='py'?/^(zh[-_]CN|cmn[-_]CN|zh[-_]Hans)/i.test(v.lang):/^en/i.test(v.lang));return all.find(v=>v.voiceURI===key)||all.find(v=>v.lang.toLowerCase()===lang.toLowerCase()&&/Tingting|Samantha|Daniel/i.test(v.name))||all.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||all[0];},
 async speak(text,track='en',kind='word',keep=false){
 if(!keep)this.stop();const token=this.token;const v=this.voice(track);this.history.push({kind,text,track,time:Date.now()});
 if(!v||!globalThis.speechSynthesis){this.available=false;toast(tr('noVoice'));return false;}
 return await new Promise(resolve=>{const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=clamp(S.settings.rate,.55,1.1);let ended=false;const done=ok=>{if(!ended){ended=true;clearTimeout(timer);resolve(ok&&this.token===token);}};u.onend=()=>done(true);u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error)&&this.token===token)toast(tr('noAudio'));done(false);};const timer=setTimeout(()=>done(false),Math.max(15000,text.length*250));speechSynthesis.speak(u);});
 },
 async clip(url,kind='phoneme',keep=false){
 if(!keep)this.stop();const token=this.token;this.history.push({kind,url,time:Date.now()});
 return new Promise(resolve=>{const a=new Audio();this.current=a;a.playbackRate=clamp(S.settings.rate+.12,.7,1);let doneAlready=false;const done=ok=>{if(doneAlready)return;doneAlready=true;clearTimeout(timer);resolve(ok&&this.token===token);};a.onended=()=>done(true);a.onerror=()=>{if(this.token===token)toast(tr('noAudio'));done(false);};const timer=setTimeout(()=>{if(this.token===token){a.pause();toast(tr('noAudio'));}done(false);},12000);a.src=url;a.play().catch(()=>{if(this.token===token)toast(tr('audioBlocked'));done(false);});});
 },
 async phoneme(code,keep=false){code=code==='AH0'?'AX':code.replace(/[012]/g,'');const src=DB.audio.englishSources?.[code];const url=src?.selected||src?.urls?.[0];if(!url){toast(tr('phonemeUnavailable'));return false;}return this.clip(url,'phoneme:'+code,keep);},
 async material(m,kind='target'){
 if(m.neutralSpeech){toast(tr('neutralContext'));return this.speak(m.neutralSpeech,'py','neutral-in-phrase');}
 if(m.type==='letter')return this.speak(m.text.toUpperCase(),'en','letter-name');
 if(m.track==='py'&&m.type==='syllable'&&m.tone!==5)return this.clip(DB.audio.pinyinBase+m.audioKey+'.mp3','pinyin-syllable');
 return this.speak(m.speech||m.text,m.track,kind);
 },
 async parts(m){this.stop();const token=this.token;
 if(m.track==='en'&&m.phonemes?.length){for(const p of m.phonemes){if(token!==this.token)return false;if(!await this.phoneme(p,true))return false;}if(token!==this.token)return false;return this.speak(m.speech,'en','whole-after-phonemes',true);}
 if(m.track==='py'&&m.type==='word'){for(const part of m.parts){if(token!==this.token)return false;const item=DB.materials.find(x=>x.type==='syllable'&&x.text===part);if(item&&item.tone!==5){if(!await this.clip(DB.audio.pinyinBase+item.audioKey+'.mp3','pinyin-syllable',true))return false;}else{toast(tr('phonemeUnavailable'));return false;}}if(token!==this.token)return false;return this.speak(m.speech,'py','whole-after-syllables',true);}
 if(m.track==='py'&&m.type==='syllable'){toast(tr('syllableExample'));return this.material(m,'syllable-example');}
 return this.material(m,'whole-example');
 }
};

 py_yw:[['i → yi · ia → ya · u → wu','没有声母时，需要按规则加写或改写 y/w。','With no initial, use the conventional y/w spellings.','所有音节前都加 y。','Put y before every syllable.','有声母时也必须加 w。','Always add w after an initial.'],['ü → yu · üe → yue · ün → yun','零声母的 ü 组写 y 并省两点。','Write y and omit the dots for zero-initial ü forms.','写成 wu、wue、wun。','Write wu, wue and wun.','y 后面永远不用 u。','Never use u after y.'],['ua → wa · uo → wo · uan → wan','没有声母时，这些 u 开头形式改写 w。','Use w for these u forms when there is no initial.','把每个 u 都删掉。','Delete every u.','给它们都加 j。','Add j to all of them.']],
 py_umlaut:[['j + ü → ju · q + ü → qu · x + ü → xu','j/q/x 后 ü 的两点省略。','Omit the two dots after j/q/x.','这里的 u 都读乌。','Here every u has the vowel in wu.','所有 ü 都必须保留两点。','Always retain the two dots.'],['n + ü → nü · l + ü → lü','n/l 后 ü 保留两点。','Keep the dots on ü after n/l.','n/l 后一律省两点。','Always omit the dots after n/l.','n/l 不能与 ü 相拼。','n/l cannot combine with ü.'],['jue · quan · xun','这里写 u，韵母仍属 ü 的一组。','The written u here belongs to the ü family.','这三个音节都没有韵母。','These syllables have no finals.','必须改写为 jwe、qwan、xwn。','They must be jwe, qwan and xwn.']],
 py_shorten:[['l + iou → liu · n + iou → niu','声母后 iou 缩写为 iu。','After an initial, iou is written iu.','iou 缩写为 ui。','iou is shortened to ui.','每次都保留 iou 三个字母。','Always keep all three letters of iou.'],['g + uei → gui · d + uei → dui','声母后 uei 缩写为 ui。','After an initial, uei is written ui.','uei 缩写为 iu。','uei is shortened to iu.','必须省掉 i。','The i must be omitted.'],['l + uen → lun · d + uen → dun','声母后 uen 缩写为 un。','After an initial, uen is written un.','uen 缩写为 en。','uen is shortened to en.','这里的 un 是 ün。','The un here is ün.']],
 py_sandhi:[['yī gè → yí gè · yī tiān → yì tiān','一在连读时变调，标写可保留本调。','一 changes tone in speech; writing can retain its citation tone.','一在任何词里都只读一声。','一 is always pronounced with first tone.','所有一都读二声。','Every 一 is second tone.'],['bù duì → bú duì · bù hǎo → bù hǎo','不在四声前通常读二声。','不 normally becomes second tone before a fourth tone.','不在三声前一律读二声。','不 always becomes second tone before a third tone.','不的标调永远改成轻声。','不 is always written with neutral tone.'],['nǐ hǎo → ní hǎo · hěn hǎo → hén hǎo','两个三声连读，前一个通常读近二声。','Of two connected third tones, the first normally becomes second tone.','两个声调都变成四声。','Both tones become fourth tone.','后一个三声变成一声。','The second becomes first tone.']],
 en_qu_x:[['quick /k/ /w/ /ɪ/ /k/ · fox /f/ /ɑ/ /k/ /s/','qu 和 x 在这些词里都代表两个音。','qu and x each represent two sounds in these words.','qu 和 x 都只能表示一个音。','qu and x each represent exactly one sound.','字母数总等于音素数。','Letter count always equals phoneme count.']],

 en_ed_t:[['jump → jumped · wash → washed · pack → packed','这些 -ed 读 /t/，不增加音节。','These -ed endings say /t/ without an extra syllable.','所有 -ed 都读 /ɪd/。','Every -ed says /ɪd/.','这些 -ed 读 /z/。','These -ed endings say /z/.']],

 en_ing:[['make → making · ride → riding · smile → smiling','这些词加 -ing 时去掉末尾不发音的 e。','These words drop final silent e before -ing.','必须保留两个 e。','Keep two e letters.','每次都去掉前面的辅音。','Always remove the initial consonant.'],['run → running · hop → hopping · swim → swimming','这些短元音词加 -ing 时双写末尾辅音。','These short-vowel words double the final consonant before -ing.','每个英语词都要双写末尾字母。','Every English word doubles its final letter.','只要有 i 就删掉 i。','Delete every i.']],

 en_soft_g:[['gem /dʒ/ · giant /dʒ/ · give /g/ · girl /g/','g 在 e/i 前可能变软，也有 give、girl 这样的例外。','g may soften before e/i, with exceptions such as give and girl.','g 在 i 前一定读 /dʒ/。','g always says /dʒ/ before i.','所有 g 都读 /ʒ/。','Every g says /ʒ/.']],

function flSave(){try{localStorage.setItem(FL_STORE,JSON.stringify(fluency));}catch{toast(tr('storageFail'));}}
function flPick(pool,n,used){const ordered=shuffle(pool).sort((a,b)=>Number(!!fluency.train[a.id])-Number(!!fluency.train[b.id]));const out=[];for(const m of ordered){if(used.has(m.text))continue;out.push(m);used.add(m.text);if(out.length===n)break;}return out;}
function flDiverse(pool,n,used){const out=[],families=new Set();for(const m of shuffle(pool)){const k=m.initial+'|'+m.final;if(used.has(m.text)||families.has(k))continue;out.push(m);used.add(m.text);families.add(k);if(out.length===n)break;}return out.length<n?out.concat(flPick(pool,n-out.length,used)):out;}
function flStart(mode){const all=new Set();let cards=[];
 if(mode==='practice'){
  const due=Object.entries(fluency.train).filter(([id,rec])=>MATERIAL.has(id)&&rec.due<=Date.now()).sort((a,b)=>Number(b[1].miss)-Number(a[1].miss)||a[1].due-b[1].due).slice(0,5);
  for(const [id] of due){const m=MATERIAL.get(id);if(!all.has(m.text)){all.add(m.text);cards.push({m,due:true});}}
  const contrasts=[m=>m.final==='iu'||m.final==='ui',m=>m.skills.includes('py_umlaut'),m=>m.skills.includes('py_whole'),m=>/n(g)?$/.test(m.final||'')];
  for(const matches of contrasts){const m=flPick(FL_COMMON.filter(matches),1,all)[0];if(m)cards.push({m,due:false});}
  cards=cards.concat(flDiverse(FL_COMMON,Math.max(1,9-cards.length),all).map(m=>({m,due:false})));
  cards=cards.concat(flPick(FL_EXTENDED,1,all).map(m=>({m,due:false})));
  cards=cards.concat(flPick(FL_TRAIN_WORDS,2,all).map(m=>({m,due:false})));
 }else{
  const realPool=FL_COMMON.length?FL_COMMON:FL_DAILY;
  cards=flDiverse(realPool,8,all).map(m=>({m,due:false}));
  const bank=(pool,n)=>{
   const fresh=pool.filter(m=>!fluency.seenTransfer[m.id]);
   const selected=flPick(fresh,n,all).map(m=>({m,due:false,fresh:true}));
   const lacking=n-selected.length;
   return lacking?selected.concat(flPick(pool,lacking,all).map(m=>({m,due:false,fresh:false}))):selected;
  };
  cards=cards.concat(bank(FL_TRANSFER_WORDS,3),bank(FL_TRANSFER_SENTENCES,1));
 }
 flRun={mode,coach:!!document.querySelector('#fl-observer')?.checked,cards,index:0,phase:'prompt',started:performance.now(),scores:[],done:false};renderFluency();
}
function flRecord(result){
 if(!flRun||flRun.phase!=='feedback'||!['correct','hesitated','miss','unknown'].includes(result))return;
 const {m,due,fresh}=flRun.cards[flRun.index],now=Date.now(),old=fluency.train[m.id]||{level:0};
 if(flRun.mode==='practice'){
  const correct=result==='correct';
  // Only a due, correctly recalled item graduates to a longer interval.
  const level=correct?Math.min(2,old.level+Number(due)):0;
  fluency.train[m.id]={level,due:correct&&!due&&old.due?old.due:now+FL_TIME[level],miss:!correct};
 }else if(m.type!=='syllable')fluency.seenTransfer[m.id]=true;
 flRun.scores.push({id:m.id,result,ms:flRun.elapsed,fresh:!!fresh,type:m.type});
 AudioEngine.stop();flRun.index++;flRun.phase='prompt';flRun.started=performance.now();
 if(flRun.index===flRun.cards.length){
  flRun.done=true;
  fluency.results.push({date:now,mode:flRun.mode,coach:flRun.coach,items:flRun.scores});
  fluency.results=fluency.results.slice(-24);
 }
 flSave();renderFluency();
}
function flReveal(result){
 if(!flRun||flRun.done||flRun.phase!=='prompt')return;
 const {m}=flRun.cards[flRun.index];const run=flRun;
 run.elapsed=Math.round(performance.now()-run.started);run.phase='feedback';run.oralAudio='loading';
 if(run.mode==='test'&&m.type!=='syllable'){fluency.seenTransfer[m.id]=true;flSave();}
 renderFluency();
 if(run.mode==='test'){
  // Check mode does not teach during a round or let the model influence observer scoring.
  if(result){flRecord(result);return;}
 }
}
async function flModel(){
 const run=flRun;if(!run||run.done||run.phase!=='feedback'||run.mode!=='practice')return;
 const idx=run.index, m=run.cards[idx].m;run.oralAudio='playing';renderFluency();
 const ok=await AudioEngine.material(m,'pinyin-fluency-model');
 if(UI.page!=='fluency'||flRun!==run||run.index!==idx)return;
 run.oralAudio=ok?'ready':'failed';renderFluency();
}
function flRateButtons(){
 return '<div class="row">'+flButton('正确且顺畅','Correct and smooth','flScore','primary','data-id="correct"')+flButton('正确但犹豫','Correct but hesitant','flScore','','data-id="hesitated"')+flButton('错了 / 没读出','Incorrect / not read','flScore','ghost','data-id="miss"')+flButton('无法确认','Unsure','flScore','ghost','data-id="unknown"')+'</div>';
}
function flSummary(run){
 const all=run.scores.length,right=run.scores.filter(a=>a.result==='correct'||a.result==='hesitated').length,smooth=run.scores.filter(a=>a.result==='correct').length;
 const counts=run.scores.filter(x=>x.fresh),rightFresh=counts.filter(a=>a.result==='correct'||a.result==='hesitated').length;
 const median=run.scores.filter(x=>x.result==='correct'||x.result==='hesitated').map(x=>x.ms).sort((a,b)=>a-b);
 const time=median.length?((median[(median.length-1)>>1]+median[median.length>>1])/2000).toFixed(1):'—';
 return '<div class="grid3"><div class="card"><h3>'+right+'/'+all+'</h3><p>'+esc(flTxt('读对（包括犹豫）','Read correctly (including hesitation)'))+'</p></div><div class="card"><h3>'+smooth+'/'+all+'</h3><p>'+esc(flTxt('读对且顺畅','Correct and smooth'))+'</p></div><div class="card"><h3>'+time+'s</h3><p>'+esc(flTxt('答对题的用时中位数（含按键）','Median correct response time (including key press)'))+'</p></div></div>'+
 (counts.length?'<p>'+esc(flTxt('首次在本模式看到的留出词句：','First-seen held-out words / sentences in this mode: '))+rightFresh+'/'+counts.length+'</p>':'')+
 (run.mode==='test'?'<p>'+esc(flTxt('建议验收：准确优先，隔天让同一旁听者抽另一组，比较读对率和顺畅度；不会的声韵调回到练习。','Suggested check: prioritize accuracy, retest another set with the same listener on another day, and compare accuracy and smoothness.'))+'</p>':'')+
 '<p class="notice">'+esc(run.coach?flTxt('以上由旁听者打分，不是自动声调识别。单次结果不等于掌握。','Observer-scored; not automatic tone recognition. One round does not establish mastery.'):flTxt('这是自评，不代表游戏验证了发音。请让家长或老师旁听一次，再隔天换一组题复测。','Self-rated, not verified pronunciation. Ask a teacher or parent to listen, then retest with a different set on another day.'))+'</p>'+
 flButton('返回训练入口','Back to Fluency Lab','flHome','primary');
}
function renderFluency(){
 const name=flTxt('拼音快读','Pinyin Fluency Lab');
 if(!flRun){
  const due=Object.values(fluency.train).filter(x=>x.due<=Date.now()).length;
  openPanel(pageHead(name,flTxt('先只看拼音，直接读出声，不逐个念字母。','Read the Pinyin aloud without sounding out each letter.'))+
  '<div class="grid2"><div class="card"><h3>'+esc(flTxt('练习：先读，再听','Practice: read, then listen'))+'</h3><p>'+esc(flTxt('熟悉的单音节与生活词交错出现，练错的隔天再来。待复习：'+due+'。','Mix familiar syllables with everyday words; review difficult items on a later day. Due: '+due+'.'))+'</p>'+
  flButton('开始快读练习','Start read-aloud practice','flStart','primary','data-id="practice"')+'</div><div class="card"><h3>'+esc(flTxt('抽测：不看汉字，不先听示范','Check: no characters or model up front'))+'</h3><p>'+esc(flTxt('8 个单音节 + 3 个词 + 1 条短句，优先抽未在本模式出现的词句。','8 syllables, 3 words, 1 short sentence. Prioritizes previously unseen transfer items.'))+'</p><p><label><input id="fl-observer" type="checkbox"> '+esc(flTxt('有家长 / 老师旁听，由他们判分','A teacher or parent is here to score'))+'</label></p>'+
  flButton('开始无提示抽测','Start unaided check','flStart','','data-id="test"')+'</div></div>'+
  '<p class="notice">'+esc(flTxt('发音从三个地方核对：声母、韵母、声调。词句允许自然变调，不要刻意逐字读本调。','Check the initial, final and tone. In connected speech, allow normal tone changes.'))+'</p>'+
  '<details><summary>'+esc(flTxt('最近快读记录','Recent read-aloud rounds'))+'</summary>'+fluency.results.slice(-5).reverse().map(r=>'<p>'+esc(new Date(r.date).toLocaleDateString())+' · '+esc(r.mode==='test'?flTxt('无提示抽测','Unaided check'):flTxt('练习','Practice'))+' · '+esc(r.coach?flTxt('旁听判分','Observer-scored'):flTxt('自评','Self-rated'))+' · '+r.items.filter(x=>x.result==='correct'||x.result==='hesitated').length+'/'+r.items.length+'</p>').join('')+'</details>'+
  '<p class="notice">'+esc(flTxt('想练到像九九乘法表：先读准，再读顺，隔天换题也能读。计时只反映从显示到按键，不是发声时间。游戏不录音、不判发音。','Aim for correct, then smooth reading, including a different set on another day. Timing ends at your button press, not speech onset. No recording or automatic pronunciation grading.'))+'</p>');
  return;
 }
 const run=flRun;
 if(run.done){openPanel(pageHead(name,flTxt('本轮快读结果','Read-aloud results'))+flSummary(run));return;}
 const {m,due,fresh}=run.cards[run.index];
 const sub=run.mode==='practice'?flTxt(due?'隔日复习':'练习','Practice'):flTxt(run.coach?'旁听者判分 · 不提示':'自评 · 不提示',run.coach?'Observer scoring · no cues':'Self-rating · no cues');
 const promptHtml='<div class="target '+(m.type==='sentence'?'sentence py':'')+'" id="fl-stimulus">'+esc(m.text)+'</div>';
 let inner='';
 if(run.phase==='prompt'){
  inner='<p class="task-note">'+esc(flTxt(m.type==='sentence'?'整句连着读，遇到标点可以停顿。':'看到就直接读出声。','Read aloud as soon as you see it.'))+'</p>'+promptHtml;
  if(run.mode==='practice'){
   inner+='<div class="row">'+flButton('我读完了，听示范','I read it · hear the model','flReveal','primary')+flButton('这题不会，听示范','I cannot read it · hear the model','flSkip','ghost')+'</div>';
  }else{
   inner+='<p class="caption">'+esc(flTxt('先读出声，再按下面的按钮。本轮不播示范。','Read aloud before choosing below. There is no model during the check.'))+'</p>'+flRateButtons();
  }
 }else{
  inner=promptHtml+'<p class="task-note" id="fl-model-note">'+esc(run.oralAudio==='playing'?flTxt('正在播放示范…','Playing model…'):run.oralAudio==='failed'?flTxt('示范音频不可用，不能据此判断发音。','The model is unavailable; do not infer accuracy from it.'):m.neutralSpeech?flTxt('轻声示范在短语最后一个音节。','Neutral tone is modelled on the last syllable of the phrase.'):flTxt('听完对照声母、韵母和声调；词句是普通话语音合成。','Compare the onset, final and tone. Words and sentences use Mandarin text-to-speech.'))+'</p>'+
  '<div class="row">'+flButton('重听示范','Replay model','flModel','ghost')+'</div>'+(run.skipped?flButton('下一题 · 这题留待复习','Next · revisit this item','flScore','primary','data-id="miss"'):flRateButtons());
 }
 openPanel(pageHead(name,sub)+'<div class="row spread"><span class="pill">'+(run.index+1)+' / '+run.cards.length+'</span>'+(fresh?'<span class="caption">'+esc(flTxt('留出题','Held-out item'))+'</span>':'')+'</div>'+inner);
}
